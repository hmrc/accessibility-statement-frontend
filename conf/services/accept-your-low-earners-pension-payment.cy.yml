serviceName: Derbyn eich taliad pensiwn i'r sawl sy'n ennill incwm isel
serviceDescription: |
  Mae derbyn eich taliadau pensiwn i’r sawl sy’n ennill incwm isel (LEPP) yn wasanaeth digidol dibynadwy a hawdd ei 
  ddefnyddio sy’n sicrhau y gall unigolion TWE sy’n ennill hyd at y terfyn di-dreth neu lai, ac sy’n cyfrannu at gynllun 
  pensiwn Trefniant Tâl Net (NPA), weld ei hawl, darparu eu manylion banc a gweld statws eu taliad er mwyn cael taliadau 
  ychwanegol rhyddhad treth yn hawdd ac yn hwylus, gan sicrhau bod pawb sy’n talu i mewn i bensiwn Ryddhad yn y Ffynhonnell 
  (RAS) neu bensiwn NPA yn cael yr un rhyddhad treth.
