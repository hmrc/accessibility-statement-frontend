serviceName: Derbyn eich taliad pensiwn i'r sawl sy'n ennill incwm isel
serviceDescription: |
  Accept your low earner's pension payment (LEPP) is a trusted, easy to use digital service which ensures that PAYE 
  individuals who earn up to or below the tax-free limit, and contribute to a NPA pension scheme, are able to view their 
  entitlement, provide their bank details and view the status of their payment in order to receive tax-relief top-up 
  payments easily and smoothly to ensure all paying into either a RAS or NPA pension receive the same tax relief.
serviceDomain: www.tax.service.gov.uk
serviceUrl: /accept-your-low-earners-pension-payment
contactFrontendServiceId: low-earners-pensions-payment-frontend
complianceStatus: partial
accessibilityProblems:
  - On the 'Your low earner's pension payments' page, screen-reader users may struggle to distinguish the table rows correctly.
  - On the 'We've received your bank details' page, users especially screen-reader users may struggle to understand the table as it does not directly describe it's purpose.
  - On the 'Your low earner's pension payments' and 'You're eligible for a total of' pages, users may be confused with the purpose of the 'Accept payment' button and 'Check calculation' links as the resulting page's title, heading and contents do not provide information regarding this functionality clearly.
  - On the 'Your low earner's pension payments' page, the 'Check calculation' links do not correctly describe it's purpose for screen-reader users.
  - When switching to Welsh, the visually-hidden 'error' prefix on the 'What are your bank details?' page stays in English. It will not be correctly pronounced by screen readers.
  - On some pages, the language toggle is using 'ENG' and 'CYM' abbreviations and on others using 'English' and 'Cymraeg' copy which may confuse users.
  - On the 'What are your bank details?' page, when a space is present in the sort code or account number fields, an error message is displayed which does not clearly identify the problem to be corrected.
  - On the 'What are your bank details?' page, when the account name does not start with capital letters, an error page is displayed which does not clearly identify the problem to be corrected.
