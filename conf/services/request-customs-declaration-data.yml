serviceName: Get customs data for import and export declarations
serviceDescription: |
  Get customs data for import and export declarations is a digital service that lets traders, declarants and third parties request and download import and export data held by HMRC. The service provides access to data from the CHIEF and Customs Declaration Service (CDS) systems.
  Users can generate trade reports through a secure, self-service platform and download them as CSV files to help meet their business and compliance needs.
serviceDomain: www.tax.service.gov.uk
serviceUrl: /request-customs-declaration-data
contactFrontendServiceId: request-customs-declaration-data
complianceStatus: partial
accessibilityProblems:
  - On some pages, screen-reader users may find it difficult to understand the purpose of the inputs as related inputs have not been grouped together. Additionally, the questions and hint texts are not correctly associated with them.
  - On the 'Available reports' page, screen-reader users may struggle to understand the tables as they do not directly describe their purpose.
  - On the 'Your contact details' page, the description list has not been coded properly so screen-reader users may not be aware of the number of items in the secondary email addresses list and the paired content.
  - On the 'What date range do you want the reports to cover?' page, the inputs in error are not identified making it difficult for users to correct the error.
  - On the 'Check your answers before submitting your request' page, the visually-hidden copy for the 'Notification email' change link does not correctly describe its purpose for screen-reader users.
  - When switching to Welsh, the visually-hidden 'warning' copy on the 'Confirm the EORI number for third-party access' page stays in English. It will not be correctly pronounced by screen readers.
  - On some pages, the language toggle is using 'ENG' and 'CYM' abbreviations and on others using 'English' and 'Cymraeg' copy which may confuse users.
  - When zooming, using a small screen such as on a mobile device or when using increased font sizes, content like email addresses do not fit on the screen fully.
milestones:
  - description: |
      Related form elements have not been grouped correctly using a fieldset and legend. And hint texts have not been programmatically associated with the form controls. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships.
    date: 2027-03-31
  - description: |
      Tables are missing captions. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships.
    date: 2027-03-31
  - description: |
      Description list has not been coded with a description term. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships.
    date: 2027-03-31
  - description: |
      Missing error identification on the form elements. This fails WCAG 2.2 success criterion 3.3.1 Error Identification.
    date: 2027-03-31
  - description: |
      The hidden copy for the change link does not describe its purpose. This fails WCAG 2.2 success criterion 2.4.4: Link Purpose (In Context) and 1.3.1 Info and Relationships.
    date: 2027-03-31
  - description: |
      Appropriate 'lang' attribute is missing to identify content as being in a different language. This fails WCAG 2.2 success criterion 3.1.2 Language of Parts.
    date: 2027-03-31
  - description: |
      The language toggle uses different copy for the options across pages. This fails WCAG 2.2 success criterion 3.2.4 Consistent Identification.
    date: 2027-03-31
  - description: |
      When content is zoom, viewed on small screens or when the font size has been increased, content overflows causing the user to horizontally scroll. This fails WCAG 2.2 success criterion 1.4.10 Reflow (AA).
    date: 2027-03-31
