serviceName: Cael data tollau am ddatganiadau mewnforio ac allforio
serviceDescription: |
  Mae cael data tollau am ddatganiadau mewnforio ac allforio yn wasanaeth digidol sy’n galluogi masnachwyr, datganwyr a thrydydd partïon i ofyn am ddata mewnforio ac allforio a ddelir gan CThEF a’i lawrlwytho.
  Mae’r gwasanaeth yn darparu mynediad at ddata o systemau CHIEF a’r Gwasanaeth Datganiadau Tollau (CDS).
  Gall defnyddwyr gynhyrchu adroddiadau masnach drwy blatfform diogel hunanwasanaeth a’u lawrlwytho fel ffeiliau CSV i helpu i ddiwallu eu hanghenion busnes a chydymffurfio.
