serviceName: Treth Enillion Cyfalaf
serviceHeaderName: Treth Enillion Cyfalaf
serviceDescription: |
  Mae’r gyfrifiannell Treth Enillion Cyfalaf yn eich galluogi i gyfrifo’r swm sy’n
  daladwy i CThEF ar gyfer Treth Enillion Cyfalaf breswyl a dibreswyl. Dyma’r dreth
  a godir ar eich elw pan fyddwch yn gwerthu eitemau megis eiddo neu gyfranddaliadau
  sydd wedi cynyddu mewn gwerth.
serviceDomain: www.tax.service.gov.uk
serviceUrl: /calculate-your-capital-gains/non-resident
contactFrontendServiceId: CGT
complianceStatus: partial
accessibilityProblems:
  - Ar derfyn amser y gwasanaeth, defnyddir teitl y dudalen i rybuddio defnyddwyr darllenwyr sgrin am y terfyn amser, ac o ganlyniad nid yw’n cael ei adnabod fel pennawd gan darllenydd sgrin.
  - Ar sawl tudalen, nid yw’r testun awgrym sy’n ymwneud â’r cwsmer wedi’i osod yn gywir gyda phob botwm radio. Mae hyn yn golygu y caiff ei ddarllen sawl gwaith gan darllenwyr sgrin pan nad yw’n berthnasol.
  - Ar dudalen ‘Treth Enillion Cyfalaf i’w thalu ar gyfer 2026/27’, mae penawdau dyblyg yn cael eu darllen gan ddarllenwyr sgrin, a all ddrysu defnyddwyr gan nad yw hyn yn cyd-fynd â hierarchaeth weledol y dudalen.
  - Ar sawl tudalen, caiff gwybodaeth a fewnbynnir ei dileu wrth lywio’n ôl ac ymlaen drwy’r gwasanaeth. Mae hyn yn golygu y bydd yn rhaid i ddefnyddwyr ail-nodi’r wybodaeth.
  - Ar dudalennau lle mae’r defnyddiwr yn nodi symiau arian, nid yw’r blwch mewnbwn wedi’i labelu’n gywir gan y symbol ‘£’, yn hytrach na label y cwestiwn ar gyfer technoleg gynorthwyol.
  - Mae’r dudalen gwestiwn gyntaf yn dod i ben ar ôl 15 munud pan nad oes unrhyw weithgarwch. Nid yw’n rhoi’r cyfle i ddefnyddwyr ymestyn eu sesiwn, a gall hyn fod yn ddryslyd gan eu bod yn cael eu tywys yn annisgwyl i dudalen terfyn amser y gwasanaeth ac yn gorfod dechrau eto.
  - Pan gaiff dilysu ei sbarduno ar dudalen ‘Rhyddhad Man Preswylio Preifat’, nid oes crynodeb o’r gwall. Mae hyn yn golygu y gallai defnyddwyr gael trafferth adnabod y broblem.
  - Mae sawl tudalen yn dangos negeseuon gwall nad ydynt yn nodi’r broblem yn gywir. Mae hyn yn golygu y galli defnyddwyr gael trafferth eu cywiro.
milestones:
  - description: "Ar dudalen terfyn amser y gwasanaeth, mae’r H1 wedi cael rôl rhybudd, sy’n disodli’r rôl y pennawd. Nid yw hyn yn bodloni maen Prawf Llwyddiant WCAG 2.2, sef 1.3.1 Gwybodaeth a Perthnasoedd."
    date: 2026-10-30
  - description: "Ar sawl tudalen, nid yw’r testun awgrym ar gyfer y set maes cyfan wedi’i gysylltu’n gywir â phob botwm radio. Nid yw hyn yn bodloni maen prawf llwyddiant 1.3.1 (Info and Relationships) Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2."
    date: 2026-10-30
  - description: "Ar dudalen ‘Treth Enillion Cyfalaf i’w thalu ar gyfer 2026/27’, mae H2au sydd wedi’u cuddio o’r golwg gyda’r un testun â’r H3au sy’n dod o’u blaen, ac nid yw hyn yn darparu hierarchaeth penawdau ystyrlon. Nid yw hyn yn bodloni maen prawf llwyddiant 1.3.1 (Info and Relationships) Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2."
    date: 2026-10-30
  - description: "Nid yw data bob amser yn cael ei gadw wrth lywio’n ôl ac ymlaen drwy’r gwasanaeth. Nid yw hyn yn bodloni maen prawf llwyddiant 3.3.7 (Redundant Entry) Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2."
    date: 2026-10-30
  - description: "Mae blychau mewnbwn arian yn cael eu labelu gan ARIA gyda’r symbol ‘£’, sy’n disodli’r ‘label’ a fwriadwyd. Mae hyn yn methu meini prawf llwyddiant WCAG 2.2, sef 2.5.3 Label yn yr Enw a 1.3.1 Gwybodaeth a Perthnasoedd."
    date: 2026-10-30
  - description: "Mae tudalen y cwestiwn cyntaf ar goll deialog terfyn amser. Nid yw hyn yn bodloni maen prawf llwyddiant 2.2.1 (Timing Adjustable) Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2."
    date: 2026-10-30
  - description: "Nid oes crynodeb gwallau ar dudalen ‘Rhyddhad Preswylfa Breifat’ pan gaiff dilysu ei sbarduno. Mae hyn yn methu maen prawf llwyddiant WCAG 2.2, sef 4.1.3 Negeseuon Statws."
    date: 2026-10-30
  - description: "Cafodd y gwasanaeth ei brofi ddiwethaf ar 27 Ebrill 2026, a gwiriwyd ei fod yn cydymffurfio â safon ‘AA’ Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2."
    date: 2026-10-30
