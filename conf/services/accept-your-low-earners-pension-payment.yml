serviceName: Accept your low earners pension payment
serviceDescription: |
  Accept your low earners pension payment (LEPP) is a trusted, easy to use, self-serve digital service which allows 
  eligible individuals to accept a tax-free payment. This payment is owed to certain individuals who have paid into a a
  net pay workplace pension scheme while earning below or close to their Personal Allowance.
