serviceName: Sign up for making Tax Digital for Income Tax
serviceDescription: |
  This service allows you to sign up your business to submit income tax updates using compatible software.
serviceDomain: www.tax.service.gov.uk
serviceUrl: /report-quarterly/income-and-expenses/sign-up
contactFrontendServiceId: MTDID
complianceStatus: partial
accessibilityProblems:
  - On the tax letters page, there is content under a heading that does not describe its context. There are also 2 headings of different levels but are the same size. Screen-reader users may struggle to find content and partially-sighted users who use screen readers may be confused by the difference between visual and screen-reader outputs.
  - The page titles for the business start date page in the agent version of the service  and the service timed out page do not describe the page content enough.
  - On the final check answers page before signing up, the visually hidden text for each ‘change’ link of each sole trader business are identical. They do not match the visual label, which means screen-reader users may struggle to understand the purpose of the links.
  - On the agent’s final check answers page, the visually-hidden text for several of the ‘change’ links do not include the visible label, which means voice-recognition users may struggle to activate the links.
  - Users with cognitive and motor impairments may find it difficult to return to a previous step, as it uses a previous answer that had an error.
  - The language switcher on the ‘cookies’, ‘terms and conditions’, and ‘get help with a technical problem’ pages have different link text than the rest of the service. Users may not be aware that these items do the same thing.
  - On several pages, the question label exposed to assistive technology does not match the intended question label. This means screen-reader users may struggle to understand what they are being asked for.
  - On the select a country page, if users type their country and then do not select that country from the dropdown list and continue, the error message does not tell them that they need to select it from the list. This may cause difficulty in correcting the error.
milestones:
  - description: Visual and semantic hierarchy does not match on the tax letters page. This fails WCAG 2.2 Success Criterion 1.3.1 Info and Relationships.
    date: 2026-09-30
  - description: The page titles on the ‘business start page’ page in the agent journey and on the service timed out page are not descriptive. This fails WCAG 2.2 Success Criterion 2.4.2 Page Titled.
    date: 2026-09-30
  - description: On the final check answers page multiple change links have the same contextual copy. This fails WCAG 2.2 Success Criteria 2.4.4 Link Purpose (In Context).
    date: 2026-09-30
  - description: On the final check answers page in agent journey multiple change links do not include the visible label in contextual copy of link text. This fails WCAG 2.2 Success Criteria 2.5.3 Label in Name.
    date: 2026-09-30
  - description: Returning to previous steps using the back link or browser back button functionality, displays pages in different states that users have been on and clears their entries. This fails WCAG 2.2 success criterion 3.3.7 Redundant Entry.
    date: 2026-09-30
  - description: The language toggle link text is not the same throughout the service. This fails WCAG 2.2 success criterion 3.2.4 Consistent Identification.
    date: 2026-09-30
  - description: On several pages the visually hidden legend is not meaningful to input. This fails WCAG 2.2 success criterion 2.4.6 Headings and Labels.
    date: 2026-09-30
  - description: The error message on the country select element is misleading and does not help users correct the error. This fails WCAG 2.2 success criterion 3.3.3 Error Suggestion.
    date: 2026-09-30
