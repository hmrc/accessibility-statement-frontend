serviceName: Cymorth i Gynilo
serviceDescription: |
  Math o gyfrif cynilo yw Cymorth i Gynilo. Mae wedi’i gefnogi gan y Llywodraeth sy’n golygu bod yr holl gynilion yn y cynllun yn ddiogel. Mae’n rhoi cyfle i rai pobl sy’n cael Credyd Cynhwysol gael bonws o 50c am bob £1 y maent yn ei chynilo dros 4 blynedd.
serviceDomain: www.tax.service.gov.uk
serviceUrl: /help-to-save
contactFrontendServiceId: help-to-save
complianceStatus: partial
accessibilityProblems:
  - Ar sawl tudalen, nid yw strwythur y penawdau wedi’i osod mewn ffordd resymegol ac nid yw’r penawdau yn disgrifio’r cynnwys. Mae hyn yn golygu ei bod hi’n bosibl y gallai defnyddwyr darllenydd sgrin gael trafferth deall strwythur y dudalen a dod o hyd i’r wybodaeth berthnasol.
  - Ar hafan y cyfrif, mae’r panel llywio ar ochr y dudalen wedi’i nodi fel rhan o’r bar llywio eilaidd. Mae’n bosibl y gallai defnyddwyr darllenydd sgrin gael trafferth wrth lywio’r cynnwys hwn.
  - Ar y dudalen ‘rheoli’ch cyfeiriad e-bost’, mae yna destun ffont trwm sy’n edrych fel pennawd ond sydd heb gael ei nodi fel pennawd Mae’n bosibl y gallai defnyddwyr darllenydd sgrin gael trafferth deall strwythur y dudalen.
  - Mae sawl problem gyda fersiwn PDF y neges ‘sut mae eich cyfrif yn gweithio’. Does dim teitl i’r ddogfen a does dim iaith wedi’i gosod. Nid yw’r penawdau, na’r elfennau strwythurol eraill, wedi’u nodi’n gywir. Nid yw’r PDF yn gweithio ar ffurf ‘ail-lifo PDF’ – mae hyn yn ei gwneud hi’n anodd chwyddo’r ddogfen.
  - Yn yr adran ‘cyfrif’, nid yw’r cysylltiad ‘ewch yn syth i’r prif gynnwys’ yn osgoi’r cysylltiad i symud yn ôl. Mae hyn yn golygu na fydd defnyddwyr bysellfwrdd yn gallu hepgor gwybodaeth ailadroddus, a gall y defnyddwyr hyn golli eu lle ar y dudalen.
  - Ar y dudalen ‘bwrw golwg dros drafodion’, mae yna sawl problem gyda’r gydran i hidlo yn ôl dyddiad. Nid yw’r testun awgrym wedi’i gysylltu’n gywir â’r meysydd mewnbwn ar gyfer nodi dyddiad, felly nid yw’r testun awgrym yn cael ei ddarllen gan y darllenydd sgrin wrth lywio drwy feysydd y ffurflen. Mae gan y cysylltiad ‘ailosod’ label hygyrch a gweladwy gwahanol, felly mae’n bosibl na all defnyddwyr meddalwedd adnabod lleferydd ddefnyddio’u llais i lywio’r dudalen.
  - Y neges gwall sy’n gysylltiedig â’r meysydd mewnbwn ar gyfer nodi dyddiad ar y dudalen ‘bwrw golwg dros drafodion’ yw ‘Nodwch ddyddiad dilys’, ac nid yw’n rhoi rhagor o wybodaeth ynghylch sut i gywiro’r gwall penodol.
  - Ar y dudalen ‘eich negeseuon’, mae’r negeseuon yn ymddangos mewn colofnau yn hytrach na mewn tabl, felly nid ydynt yn cael eu darllen gan ddarllenydd sgrin. Mae’r negeseuon wedi’u codio fel botymau, ond yn ymddangos fel cysylltiadau. Mae’n bosibl y gallai defnyddwyr darllenydd sgrin gael trafferth deall strwythur y dudalen.
  - Os byddai defnyddwyr yn dewis y botwm ‘ail-anfon yr e-bost’ wrth gadarnhau eu cyfeiriad e-bost, nid oes neges yn ymddangos i gadarnhau bod y botwm wedi ail-anfon yr e-bost yn llwyddiannus.
  - Ar y dudalen ‘eich manylion’, nid oes gan y cysylltiadau ‘newid’ y testun ychwanegol cywir er mwyn i dechnoleg gynorthwyol allu rhoi cyd-destun o ran pwrpas y cysylltiad. Mae hyn yn golygu bod pob cysylltiad yn ymddangos fel ‘change change’ i ddarllenydd sgrin.
  - Os bydd defnyddwyr yn nodi e-bost yn y fformat anghywir, bydd y broses ddilysu yn dechrau. Wrth i’r defnyddwyr gywiro’r gwall a pharhau i’r tudalennau nesaf, bydd yr wybodaeth gywir a nodwyd yn cael ei dileu os byddant yn llywio yn ôl i’r dudalen ‘cyfeiriad e-bost’. Mae hyn yn golygu y bydd yn rhaid i ddefnyddwyr nodi’r wybodaeth eto.
  - Os byddai mwy nag un gwall yn codi ar y dudalen ‘taliadau Barclaycard’, dim ond y gwall cyntaf sy’n cael ei nodi fel gwall. Mae hyn yn ei gwneud hi’n anoddach i ddefnyddwyr gywiro’r gwallau eraill.
  - Mae yna achosion lle mae defnyddwyr yn cael eu hallgofnodi o’r gwasanaeth os nad oes gweithgarwch, a hynny heb rybudd na chyfle iddynt ymestyn eu sesiwn. Mae’n bosibl y gallai defnyddwyr gael trafferth os byddai angen rhagor o amser arnynt i gwblhau tasgau ac, o ganlyniad i hynny, byddant yn gorfod ail-ddechrau’r broses.
  - Ar y dudalen ‘taliadau Barclaycard’, nid yw’r labelau gweladwy ar gyfer y maes ‘dyddiad dod i ben y cerdyn’ yn cyd-fynd â’r labelau sy’n ymddangos i’r sawl sy’n defnyddio technoleg gynorthwyol. O ganlyniad i hyn, mae’n bosibl na all defnyddwyr meddalwedd adnabod lleferydd ddefnyddio’u llais i lywio’r dudalen.
  - Ar y dudalen ‘a ydych yn siŵr eich bod am gau eich cyfrif?’, mae 2 ranbarth yn rhannu’r un enw hygyrch. Mae hyn yn golygu ei bod hi’n bosibl y gallai defnyddwyr darllenydd sgrin gael trafferth llywio’r dudalen hon.
  - Nid yw’r cwestiynau ‘faint o arian rydych am ei godi/ei dalu i mewn’ wedi’u strwythuro’n gywir. Nid yw’r labelau na’r testun awgrym wedi’u cysylltu â’r maes mewnbwn, ac felly mae’n bosibl y gallai defnyddwyr darllenydd sgrin golli’r wybodaeth hon. Nid yw’r label gweladwy yn cyd-fynd â’r label sy’n gysylltiedig â’r maes mewnbwn, a gallai hyn ddrysu defnyddwyr darllenydd sgrin.
  - Nid yw’r labelau hygyrch ar gyfer logo’r Apple App Store a’r Google Store yn cyd-fynd â’r cysylltiadau gweladwy. Gallai hyn ddrysu defnyddwyr darllenwyr sgrin. Mae hyn yn waeth ar dudalennau sydd wedi’u gosod yn Gymraeg, gan nad yw’r testun delwedd wedi’i gyfieithu.
  - Ar y tudalennau ‘faint o arian rydych am ei godi/ei dalu i mewn’, os bydd gwall yn codi, nid yw’r negeseuon gwall wedi’u cysylltu â’r blwch mewnbwn. Mae hyn yn golygu y gallai defnyddwyr darllenydd sgrin golli’r wybodaeth hon.
  - Ar rai tudalennau, mae gan y dangosydd ffocws gyferbynnedd isel yn erbyn y cefndir. Mae hyn yn ei gwneud hi’n anodd i ddefnyddwyr â golwg gwan weld y dangosyddion hyn ar y dudalen.
  - Ar y dudalen ‘os ydych o’r farn eich bod yn gymwys am gyfrif Cymorth i Gynilo’, nid oes modd defnyddio bysellfwrdd i gael mynediad at un o’r cysylltiadau. Mae hyn yn golygu na all defnyddwyr sy’n llywio gan ddefnyddio bysellfwrdd gael mynediad at y cysylltiad hwn.
  - Ar y dudalen ‘taliadau Barclaycard’, os bydd gwall yn codi, mae’r holl wybodaeth a nodwyd gan y defnyddiwr yn cael ei dileu ac mae’n rhaid ei nodi eto.
  - Os bydd y cysylltiad ‘allgofnodi’ ym mhennawd y dudalen yn cael ei ddefnyddio, neu os bydd ffenestr naid terfyn amser yn ymddangos, bydd y dudalen sy’n dilyn yn dangos y geiriau ‘nid oedd modd cwblhau’ch cais’. Mae’n bosibl na fydd y defnyddwyr yn cael cadarnhad eu bod wedi allgofnodi’n llwyddiannus.
  - Ar y dudalen ‘taliadau Barclaycard’, mae’n bosibl nad yw’r meysydd mewnbwn ar gyfer nodi manylion y cerdyn yn rhoi’r cyfle i ddefnyddwyr ddefnyddio data sydd wedi’u cadw’n flaenorol yn ei borwr i ragboblogi’r meysydd.
  - Mae gan rai o’r cysylltiadau a’r botymau gyferbynnedd isel yn erbyn y cefndir. Mae hynny’n ei gwneud hi’n anodd i ddefnyddwyr sy’n defnyddio ffocws y bysellfwrdd, neu sy’n hofran dros y cysylltiadau a’r botymau hyn, ddarllen y testun.
  - Wrth chwyddo’r dudalen ‘taliadau Barclaycard’, mae’r testun ‘Visa’ yn y maes ar gyfer nodi rhif cerdyn yn gorgyffwrdd â’r rhif sy’n cael ei nodi gan y defnyddwyr, a hynny’n ei gwneud hi’n anodd ei ddarllen.
  - Yn yr adran ‘cyfrif’, mae’r ffenestr naid terfyn amser wedi torri’n rhannol, a gall y cynnwys hwn fynd ar goll wrth chwyddo’r sgrin.
  - Wrth osod yr iaith yn Gymraeg, mae gan y cysylltiadau ‘newid’ destun sydd wedi’i guddio o’r golwg sydd heb gael ei gyfieithu ac sydd heb ei godio’n gywir. Mae hyn yn gallu ei gwneud hi’n anodd i ddarllenwyr sgrin ynganu’r cynnwys yn gywir.
  - Nid yw trefn yr elfennau llywio, megis y cysylltiad ‘polisi preifatrwydd’ yn y troedyn, yn gyson ar draws y gwasanaeth. Mae hyn yn golygu ei bod hi’n bosibl y gallai defnyddwyr sy’n dibynnu ar gysondeb gael trafferth dod o hyd i’r elfennau hyn.
  - Nid yw lleoliad y togl Cymraeg na’r cysylltiad i roi gwybod am broblem dechnegol yn gyson ar draws y gwasanaeth. Mae hyn yn golygu ei bod hi’n bosibl na fyddai defnyddwyr yn sylweddoli bod gan yr eitemau yr un pwrpas.
  - Nid yw’r neges gwall sy’n gysylltiedig â’r maes mewnbwn ‘a ydych am gael e-byst atgoffa ynghylch cynilion?’ yn berthnasol i’r gwall sy’n codi mewn gwirionedd. Mae hyn yn golygu y gallai defnyddwyr gael trafferth cywiro’r gwall.
  - Ar y dudalen ‘taliadau Barclaycard’, mae’r dangosydd ffocws ar goll ar gyfer 2 dab olaf y bysellfwrdd, sy’n golygu ei bod hi’n bosibl y gallai defnyddwyr golli eu lle ar y dudalen.
  - Ar y dudalen ‘taliadau Barclaycard’, nid yw’r negeseuon gwall sy’n gysylltiedig â’r maes mewnbwn ‘rhif y cerdyn’ yn ddigon penodol. Mae’n bosibl y gallai defnyddwyr gael trafferth gwybod yr hyn sydd o’i le gyda’r wybodaeth a nodwyd ganddynt.
  - Ar y dudalen ‘taliadau Barclaycard’, mae yna bennawd sydd wedi’i guddio o’r golwg ac nid yw’n disgrifio’r cynnwys sy’n ei ddilyn. Mae’n bosibl y gallai defnyddwyr darllenydd sgrin gael trafferth deall strwythur y dudalen a dod o hyd i wybodaeth.
