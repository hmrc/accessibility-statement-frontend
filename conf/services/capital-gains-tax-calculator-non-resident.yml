serviceName: Capital Gains Tax
serviceHeaderName: Capital Gains Tax
serviceDescription: |
  The Capital Gains Tax calculator lets you work out the amount payable to HMRC
  for resident and non-resident Capital Gains Tax. This is the tax on your profit
  when you sell items like property or shares that have increased in value.
serviceDomain: www.tax.service.gov.uk
serviceUrl: /calculate-your-capital-gains/non-resident
contactFrontendServiceId: CGT
complianceStatus: partial
accessibilityProblems:
  - On the service timeout, the page heading is used to alert screen-reader users about the timeout, and as a result it is not recognised as a heading by screen readers.
  - On several pages, the hint text relating to the question has not been set up correctly with each radio button. This means it will be read multiple times by screen readers when it’s not relevant.
  - On the ‘Capital Gains Tax to pay for 2026/27’ page, there are duplicated headings read out by screen readers which may confuse users as it does not match the page’s visual hierarchy.
  - On several pages, user-entered information is deleted when navigating backward and forward through the service. This means users will have re-enter the information.
  - On pages where the user enters monetary amounts, the input box has not been labelled correctly by the ‘£’ symbol, instead of the question label for assistive technology.
  - The first question page times out after 15 minutes when there’s no activity. It does not give users the opportunity to extend their session which may be disorientating as they are unexpectedly taken to a service timed out page and have to start again.
  - When validation is triggered on the ‘private residence relief’ page, there is no error summary. This means users may have a harder time identifying the problem.
  - Several pages display error messages that do not identify the problem correctly. This means users may struggle to correct them.
milestones:
  - description: "On the service timeout page the H1 has been given the role of alert which overrides the heading role. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships."
    date: 2026-10-30
  - description: "On several pages hint text for the entire fieldset is not correctly associated with each radio. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships."
    date: 2026-10-30
  - description: "On the ‘Capital Gains Tax to pay for 2026/27’ page there are visually hidden H2s with the same text as the H3s before them which does not provide a meaningful heading hierarchy. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships."
    date: 2026-10-30
  - description: "Data is not always maintained when navigating backward and forward through the service. This fails WCAG 2.2 success criterion 3.3.7 Redundant Entry."
    date: 2026-10-30
  - description: "Currency input boxes are aria-labelled by a ‘£’ symbol, which overrides the intended ‘label’. This fails WCAG 2.2 success criteria 2.5.3 Label in Name and 1.3.1 Info and Relationships."
    date: 2026-10-30
  - description: "The first question page is missing a timeout dialog. This fails WCAG 2.2 success criterion 2.2.1 Timing Adjustable."
    date: 2026-10-30
  - description: "The ‘private residence relief’ page does not have an error summary when validation is triggered. This fails WCAG 2.2 success criteria 4.1.3 Status messages."
    date: 2026-10-30
  - description: "Several pages have misleading error messages. This fails WCAG 2.2 success criteria 3.3.3 Error Suggestion."
    date: 2026-10-30
