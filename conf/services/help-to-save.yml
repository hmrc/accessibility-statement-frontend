serviceName: Help to Save
serviceDescription: |
  Help to Save is a type of savings account. It is backed by the government so all savings in the scheme are secure. It allows certain people receiving Universal Credit to get a bonus of 50p for every £1 they save over 4 years.
serviceDomain: www.tax.service.gov.uk
serviceUrl: /help-to-save
contactFrontendServiceId: help-to-save
complianceStatus: partial
accessibilityProblems:
  - On several pages the heading structure has not been set up logically and the headings do not describe the content. This means that screen-reader users may struggle to understand the page structure and find the relevant information.
  - The sidebar navigation on the ‘account home’ is not marked up as part of the secondary navigation bar. Screen-reader users may struggle to navigate this content.
  - On ‘manage your email address’ there is bold text that visually looks like a heading, but is not programmatically marked up as that. Screen-reader users may struggle to understand the structure of the page.
  - There are multiple issues with the PDF version of the ‘How your account works’ message. There is no document title or set language. The headings and other structural elements are not marked up correctly. The PDF does not work in ‘reflow’ mode which makes it hard to zoom in on the document.
  - In the account section, the ‘skip to main content’ link does not bypass the ‘back link’. This means keyboard users cannot easily skip the repeated content and may be confused about their location on the page.
  - There are multiple issues with the filter by date component on the ‘view transactions’ page. The hint text is not correctly associated with the date input fields and is not read out by screen readers when navigating by form field. The ‘reset’ link has a different visual and accessible label, meaning speech-recognition users may not be able to activate the controls with voice commands.
  - The error message for the date inputs on the ‘View Transactions’ page is always ‘Enter a valid date’ and does not provide further information on how to correct the specific error made.
  - On the ‘Your Messages’ inbox page, the messages are presented in columns without being in a table which is not picked up by screen readers. The messages are coded as buttons but appear as links. Screen-reader users may struggle to understand the page structure.
  - When confirming their email address, if users select the ‘resend the email’ button nothing is shown on the page, such as a page title change, to confirm the resend was successful.
  - On the ‘your details’ page the ‘change’ links do not have correct additional text for assistive technology to provide context for the link purpose and will be read as ‘change change’ for screen readers.
  - If users enter an email that has not been correctly formatted, validation is triggered. When they fix the error and continue to later pages, the corrected input is deleted if they navigate back to the email address page. This means users will have to input the information again.
  - On the Barclaycard payment page, if users submit the page with multiple fields in error, only the first field is highlighted as an error. This makes it harder for users to fix all the other errors.
  - There are instances where users are signed out of the service when there is no activity without any warning or option to extend their session. Users who need more time to complete tasks may struggle and have to restart processes.
  - On the ‘Barclaycard payment’ page, the visible labels for the card expiry date fields do not match the labels shown to assistive tech users. As a result, speech-recognition users may not be able to activate the controls with voice commands.
  - On the ‘Are you sure you want to close your account?’ page there are 2 regions with the same accessible name. This means screen-reader users may struggle to orientate themselves on the page.
  - The ‘how much do you want to withdraw/pay in’ questions are not correctly programmatically structured. Labels and hint text are not associated with the input field and may be missed by screen-reader users. The visible label does not match the accessible label for the input field, which may confuse partly-sighted users who use screen readers.
  - The accessible labels for the Google and Apple app store logo links do not match the visual links. This may confuse partly-sighted users who use screen readers. This is worse when the language is set to Welsh, as the image text has not been translated.
  - On the ‘how much do you want to withdraw/pay in’ pages, if an error is triggered the error message is not programmatically associated with the input box. This means it may be missed by screen-reader users.
  - On some pages, the focus indicator has a low contrast against the background. This makes it hard for low-vision users to see where they are on the page.
  - On the ‘if you think you’re eligible for a Help to Save account’ page there is a link that cannot be accessed using the keyboard. This means that users who rely on keyboard navigation cannot access the link.
  - On the ‘Barclaycard payment’ page, when an error is triggered for one input field, all the information entered by the user is deleted and must be re-entered.
  - When the ‘sign out’ link in the page header or the service timeout pop-up is activated, the page shown has a title of ‘Your request cannot be completed’. Users may not be sure that they have successfully signed out.
  - The card details input fields on the Barclaycard Payment page may not offer the user the option to populate from data previously saved in their browser.
  - Some links and buttons have low colour contrast between the text and background when receiving keyboard focus or when they are hovered over with the mouse, making it hard to read the text.
  - When the page is viewed at higher zoom levels or on a mobile device, the ‘Visa’ text in the card number field on the Barclaycard payment page overlaps with the card number entered by users, making it hard to read.
  - The service timeout pop-up in the account section is partially cut off and some content is hidden at higher zoom levels.
  - When the language is set to Welsh, the change links have visually hidden content that has not been translated but it had not been coded correctly, so screen readers may not pronounce it correctly.
  - Navigational elements, such as the ‘privacy policy’ link in the footer, are in different relative order across the service. This means that users who rely on consistency may struggle to find them.
  - The Welsh language toggle and report technical issue links have different labels on different pages. This means users may not be aware that these items have the same purpose.
  - When an error is triggered for the ‘Do you want to receive email savings reminders?’ input field, the error message does not relate to the error. This means that users may struggle to correct the error.
  - On the ‘Barclaycard payment’ page, the focus indicator is missing for the last 2 keyboard tabs which makes it difficult for users to know where they are on the page.
  - The error messages for the card numbers on the Barclaycard payment page are not specific enough. Users may struggle to identify what is wrong with their submission.
  - On the Barclaycard payment page, there is a visually hidden heading that does not describe the content after it. Screen-reader users may struggle to understand the page structure and find information.
milestones:
  - description: On several pages the heading structure is not logical and content is nested under irrelevant headings. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships.
    date: 2026-12-31
  - description: The sidebar navigation on ‘Account home’ is visually styled as navigation but is not marked up as a navigation region. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships.
    date: 2026-12-31
  - description: On the ‘Manage your email address’ page there is text styled as a heading that is not programmatically marked up as a heading. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships.
    date: 2026-12-31
  - description: The ‘How your account works’ PDF does not have a page title or language set, is missing important structural mark up and does not reflow.  This fails WCAG 2.2 success criteria 1.3.1 Info and Relationships, 2.4.2 Page Titled, 3.1.1 Language of Page and 1.4.10 Reflow.
    date: 2026-12-31
  - description: 'The skip link in the account section does not bypass the navigational ‘back’ link. This fails WCAG 2.2 success criterion 2.4.1: Bypass Blocks.'
    date: 2026-12-31
  - description: 'The date inputs on the ‘View Transactions’ page have hint text that is not associated with the inputs and a filter link with different visual and accessible labels. This fails WCAG 2.2 success criteria 1.3.1: Info and Relationships and 2.5.3: Label in Name.'
    date: 2026-12-31
  - description: The error messages for the date inputs on the ‘View Transactions’ page are not specific to input error. This fails WCAG 2.2 success criterion 3.3.3 Error Suggestion.
    date: 2026-12-31
  - description: On the ‘Your messages’ page the messages are coded as buttons but look like links and are presented in columns without table structure. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships.
    date: 2026-12-31
  - description: When a ‘resend the email’ button is selected there is no page content or title change to confirm if action has occurred.  This fails WCAG 2.2 success criterion 2.4.2 Page Titled.
    date: 2026-12-31
  - description: On the ‘Your details’ page the contextual copy for the change links is ‘change’ which does not reflect link purpose. This fails WCAG 2.2 success criterion 2.4.4 Link Purpose (In Context).
    date: 2026-12-31
  - description: 'If validation is triggered and then passed for the email address field, the correct input is deleted when the user navigates back to the page. This fails WCAG 2.2 success criterion 3.3.7: Redundant Entry.'
    date: 2026-12-31
  - description: On the Barclaycard Payment page if multiple fields trigger validation the error message displayed only references the first field in error. This fails WCAG 2.2 success criterion 3.3.3 Error Identification.
    date: 2026-12-31
  - description: Users are sometimes timed out of service without any notification. This fails WCAG 2.2 success criterion 2.2.1 Timing Adjustable.
    date: 2026-12-31
  - description: The accessible names for the expiry date fields on the Barclaycard payment page do not start with the visible label text. This fails WCAG 2.2 success criterion 2.5.3 Label in Name.
    date: 2026-12-31
  - description: On the ‘Are you sure you want to close your account?’ there are 2 navigation regions with the same accessible name, despite having different content within them. This fails WCAG 2.2 success criterion 1.3.1 Info and Relationships.
    date: 2026-12-31
  - description: The ‘how much do you want to withdraw/pay in’ questions have label elements and hint text that are not associated, and a different visual and accessible label for the input. This fails WCAG 2.2 success criteria 1.3.1 Info and Relationships and 2.5.3 Label in Name.
    date: 2026-12-31
  - description: The accessible labels for the Google and Apple app store logo links are different from the visual label. This fails WCAG 2.2 success criterion 2.5.3 Label in Name.
    date: 2026-12-31
