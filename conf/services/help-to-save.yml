    date: 2026-12-31
  - description: There are instances where there is not enough colour contrast between focus indicator and background. This fails WCAG 2.2 success criterion 1.4.11 Non-text Contrast.
    date: 2026-12-31
  - description: On the ‘If you think you’re eligible for a Help to Save account’ page there is a link that is not keyboard accessible. This fails WCAG 2.2 success criterion 2.1.1 Keyboard.
