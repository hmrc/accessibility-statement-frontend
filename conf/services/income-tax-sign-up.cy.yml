  - description: Ar y dudalen wirio atebion derfynol yn llwybr yr asiant, nid yw cysylltiadau newid lluosog yn cynnwys y label gweladwy yn nhestun cyd-destunol y cysylltiad. Nid yw hyn yn bodloni maen prawf llwyddiant 2.5.3 (Label in Name) Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2
    date: 2026-09-30
  - description: Mae dychwelyd i gamau blaenorol gan ddefnyddio’r cysylltiad ’yn ôl’ neu swyddogaeth botwm ’yn ôl’ y porwr yn dangos tudalennau yn y cyflyrau gwahanol y bu defnyddwyr ynddynt, ac yn clirio eu cofnodion. Nid yw hyn yn bodloni maen prawf llwyddiant 3.3.7 (Redundant Entry) Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2.
    date: 2026-09-30
  - description: Nid yw testun y cysylltiad newid yr iaith yr un fath drwy’r gwasanaeth cyfan. Nid yw hyn yn bodloni maen prawf llwyddiant 3.2.4 (Consistent Identification) Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2.
    date: 2026-09-30
  - description: Ar sawl tudalen, nid yw’r allwedd sydd wedi’i chuddio o’r golwg yn ystyrlon ar gyfer y mewnbwn. Nid yw hyn yn bodloni maen prawf llwyddiant 2.4.6 (Headings and Labels) Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2.
    date: 2026-09-30
  - description: Mae’r neges gwall ar yr elfen dewis gwlad yn gamarweiniol ac nid yw’n helpu defnyddwyr i gywiro’r gwall. Nid yw hyn yn bodloni maen prawf llwyddiant 3.3.3 (Error Suggestion) Canllawiau Hygyrchedd Cynnwys y We, fersiwn 2.2.
    date: 2026-09-30
