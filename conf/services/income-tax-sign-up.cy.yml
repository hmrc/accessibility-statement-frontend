    date: 2026-09-30
  - description: Ar y dudalen olaf i wirio atebion, mae gan gysylltiadau newid lluosog yr un testun cyd-destunol. Nid yw hyn yn bodloni maen prawf llwyddiant WCAG 2.4.4 Link Purpose (In Context) y We, fersiwn 2.2.
