serviceName: Cofrestru ar gyfer y cynllun Troi Treth yn Ddigidol ar gyfer Treth Incwm
serviceDescription: |
  Mae’r gwasanaeth hwn yn eich galluogi i gofrestru’ch busnes i gyflwyno diweddariadau treth incwm gan ddefnyddio meddalwedd sy’n cydweddu.
serviceDomain: www.tax.service.gov.uk
serviceUrl: /report-quarterly/income-and-expenses/sign-up
contactFrontendServiceId: MTDID
complianceStatus: partial
accessibilityProblems:
  - Ar y dudalen llythyrau treth, mae cynnwys o dan bennawd nad yw’n disgrifio ei gyd-destun. Mae hefyd 2 bennawd o lefelau gwahanol, ond maent o’r un maint. Gall defnyddwyr darllenwyr sgrin ei chael hi’n anodd dod o hyd i gynnwys, a gall defnyddwyr sy’n rhannol ddall sy’n defnyddio darllenwyr sgrin gael eu drysu gan y gwahaniaeth rhwng yr allbwn gweledol a’r allbwn darllenydd sgrin.
  - Nid yw teitlau’r tudalennau ar gyfer y dudalen dyddiad dechrau’r busnes yn fersiwn asiant y gwasanaeth, a’r dudalen allgofnodi o’r gwasanaeth, yn disgrifio cynnwys y tudalennau yn ddigonol.
  - Ar y dudalen wirio derfynol cyn cofrestru, mae’r testun sydd wedi’i guddio o’r golwg ar gyfer pob cysylltiad ‘newid’ ar gyfer pob busnes unig fasnachwr yn union yr un fath. Nid ydynt yn cyfateb i’r label gweledol, sy’n golygu y gallai defnyddwyr darllenwyr sgrin ei chael hi’n anodd deall pwrpas y cysylltiadau.
  - Ar dudalen olaf yr asiant i wirio atebion, nid yw’r testun sydd wedi’i guddio o’r golwg ar gyfer nifer o’r cysylltiadau ‘newid’ yn cynnwys y label gweladwy; mae hyn yn golygu y gallai defnyddwyr sy’n defnyddio technoleg cydnabyddiaeth llais ei chael hi’n anodd actifadu’r cysylltiadau.
  - Gall fod yn anodd i ddefnyddwyr sydd â namau gwybyddol ac echddygol ddychwelyd i gam blaenorol, gan ei fod yn defnyddio ateb blaenorol a oedd yn cynnwys gwall.
  - Mae gan y cyfleuster newid yr iaith ar y tudalennau ‘cwcis’, ‘telerau ac amodau’, a ‘chael cymorth gyda phroblem dechnegol’ destun cysylltiad gwahanol i weddill y gwasanaeth. Mae’n bosibl nad yw defnyddwyr yn ymwybodol bod y rhain yn gwneud yr un peth.
  - Ar sawl tudalen, nid yw’r label cwestiwn sy’n weladwy i dechnoleg gynorthwyol yn cyfateb i’r label cwestiwn arfaethedig. Mae hyn yn golygu y gallai defnyddwyr darllenwyr sgrin ei chael hi’n anodd deall yr hyn y gofynnir amdano.
  - Ar y dudalen dewis gwlad, os yw defnyddwyr yn teipio enw eu gwlad ond heb ei dewis o’r rhestr ostwng cyn bwrw ymlaen, nid yw’r neges gwall yn rhoi gwybod iddynt fod angen iddynt ei dewis o’r rhestr. Gall hyn achosi anhawster wrth gywiro’r gwall.
